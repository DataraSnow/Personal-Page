<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Work · Dario Trojan</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono&family=Newsreader:ital,wght@0,400;1,400&display=swap" rel="stylesheet">

  <script src="theme.js"></script>     <!-- light/dark; applies before paint -->
  <!-- Same content as the home page. One detail page serves every work. -->
  <script src="content.js"></script>

  <style>
    :root{
      --paper:#ececea; --ink:#0a0a0a; --signal:#1d2dff;
      --muted: color-mix(in srgb, var(--ink) 55%, var(--paper) 45%);
      --line:  color-mix(in srgb, var(--ink) 18%, transparent);
      --display:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
      --serif:"Newsreader",Georgia,serif;
      --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
    }
    *{ margin:0; padding:0; box-sizing:border-box; }
    body{ background:var(--paper); color:var(--ink); font-family:var(--display);
          -webkit-font-smoothing:antialiased; line-height:1.5; transition:background .2s, color .2s; }
    a{ color:inherit; text-decoration:none; }
    ::selection{ background:var(--signal); color:var(--paper); }

    .mode-toggle{ appearance:none; background:transparent; border:1px solid var(--line);
      width:30px; height:30px; display:inline-flex; align-items:center; justify-content:center;
      color:var(--ink); cursor:pointer; padding:0; transition:border-color .15s, color .15s; }
    .mode-toggle:hover{ border-color:var(--ink); color:var(--signal); }
    .mode-toggle svg{ width:16px; height:16px; }

    .top{ display:flex; justify-content:space-between; align-items:center;
      padding:18px 48px; border-bottom:1px solid var(--ink);
      font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; }
    .top .mark{ font-weight:800; letter-spacing:-.01em; font-size:13px; display:flex; align-items:center; gap:8px; }
    .top .mark .sq{ width:10px; height:10px; background:var(--signal); }
    .top .back:hover{ color:var(--signal); }

    .wrap{ max-width:1100px; margin:0 auto; padding:64px 48px 96px; }
    .crumb{ font-family:var(--mono); font-size:11px; letter-spacing:.16em;
      text-transform:uppercase; color:var(--signal); margin-bottom:22px; }
    h1{ font-family:var(--display); font-weight:800; text-transform:uppercase;
      font-size:clamp(40px,7vw,92px); line-height:.9; letter-spacing:-.03em; margin-bottom:24px; }
    h1 em{ font-family:var(--serif); font-style:italic; font-weight:400; text-transform:none; }

    .meta{ display:flex; flex-wrap:wrap; gap:14px 28px; font-family:var(--mono);
      font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted);
      padding:18px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); margin-bottom:36px; }
    .meta b{ color:var(--ink); font-weight:500; }

    .cover{ width:100%; aspect-ratio:16/9; border:1px solid var(--ink);
      margin-bottom:40px; background-size:cover; background-position:center; }
    .cover img{ width:100%; height:100%; object-fit:cover; display:block; }

    .lead{ font-family:var(--serif); font-style:italic; font-size:clamp(22px,3vw,32px);
      line-height:1.35; max-width:30ch; margin-bottom:28px; }
    .body{ max-width:60ch; font-size:18px; line-height:1.6; }
    .body p{ margin-bottom:1em; }
    .placeholder{ color:var(--muted); }

    .nav{ display:flex; justify-content:space-between; gap:20px; margin-top:64px;
      padding-top:24px; border-top:1px solid var(--ink); font-family:var(--mono);
      font-size:11px; letter-spacing:.14em; text-transform:uppercase; }
    .nav a:hover{ color:var(--signal); }
    .nav .disabled{ color:var(--line); pointer-events:none; }

    .missing{ font-family:var(--mono); font-size:13px; color:var(--muted); }
    @media(max-width:760px){ .top,.wrap{ padding-left:22px; padding-right:22px; } }
  </style>
</head>
<body>
  <div class="top">
    <a class="mark" href="index.html"><span class="sq"></span>D · TROJAN</a>
    <span style="display:flex;align-items:center;gap:18px">
      <a class="back" href="archive.html">← All works</a>
      <button class="mode-toggle" id="themeBtn"></button>
    </span>
  </div>

  <main class="wrap" id="main"><p class="missing">Loading…</p></main>

  <script>
    DTTheme.mountToggle(document.getElementById('themeBtn'));
    // Read ?w=<slug> from the URL and render that work from content.js.
    (function () {
      var works = (window.SITE && window.SITE.works) || [];
      var slug  = new URLSearchParams(location.search).get('w');
      var idx   = works.findIndex(function (x) { return x.slug === slug; });
      var main  = document.getElementById('main');

      if (idx === -1) {
        document.title = 'Not found · Dario Trojan';
        main.innerHTML =
          '<div class="crumb">404</div>' +
          '<h1>Not found.</h1>' +
          '<p class="missing">No piece with id “' + (slug || '') + '”. ' +
          '<a style="color:var(--signal)" href="archive.html">Back to the archive →</a></p>';
        return;
      }

      var w    = works[idx];
      var prev = works[idx - 1];
      var next = works[idx + 1];
      document.title = w.title + ' · Dario Trojan';

      // Cover: real image if present, else the gradient fallback.
      var cover = w.image
        ? '<div class="cover"><img src="' + w.image + '" alt="' + w.title +
          '" onerror="this.parentNode.style.background=\'' + (w.fill || '') +
          '\';this.remove();"></div>'
        : '<div class="cover" style="background:' + (w.fill || '') + '"></div>';

      main.innerHTML =
        '<div class="crumb">' + w.id + ' · ' + w.tag + '</div>' +
        '<h1><em>' + w.title + '</em></h1>' +
        '<div class="meta">' +
          '<span>Year <b>' + w.year + '</b></span>' +
          '<span>Type <b>' + w.tag + '</b></span>' +
          '<span>Ref <b>' + w.id + '</b></span>' +
        '</div>' +
        cover +
        '<p class="lead">' + w.desc + '</p>' +
        '<div class="body"><p class="placeholder">The Project ' +
          '<em>' + w.title + '</em> has been a lot of fun. ' +
          'If you have any questions, feel free to contact me. ' +
          'I hope you liked this small project of mine, I know I did :D</p></div>' +
        '<div class="nav">' +
          (prev ? '<a href="work.html?w=' + prev.slug + '">← ' + prev.title + '</a>'
                : '<span class="disabled">← Start</span>') +
          (next ? '<a href="work.html?w=' + next.slug + '">' + next.title + ' →</a>'
                : '<span class="disabled">End →</span>') +
        '</div>';
    })();
  </script>
</body>
</html>
